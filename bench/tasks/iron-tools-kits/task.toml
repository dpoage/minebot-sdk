schema_version = "1.3"
# Generated by bench/gen-tasks.ts. Edit the catalog there, then rerun it.
# Two sidecars hold what Harbor copies to the verifier: the body, every program the agent ran with its output
# (/var/log/minebot), and the grader, the player's statistics and what the saved world shows (/var/log/grading).
artifacts = [
  { source = "/var/log/minebot", destination = "minebot", service = "body" },
  { source = "/var/log/grading", destination = "grading", service = "grader" },
]

[task]
name = "minebot/iron-tools-kits"
description = "From an empty inventory, mine iron ore, smelt it, and craft an iron pickaxe."
keywords = ["minecraft","crafting","mining","smelting","embodied","code-as-action","tier-kits"]

[metadata]
category = "minecraft"
tier = "kits"
# Every tier has the base body: Mineflayer plus notes, status (deaths and reconnects), the event log with blocking waits, and the one-line observation.
kits = ["gatherer","crafter","builder","explorer","social"]
wiki = "off"
goals = false
triggers = false
difficulty_explanation = "Eleven dependent steps: the stone pickaxe chain, then iron ore found underground, a furnace, fuel, smelting, and the iron pickaxe. Adds exploration for ore, the furnace, and a crafting chain longer than the stone pickaxe's."

[agent]
timeout_sec = 3600.0

# The verifier runs in a container of its own, built from tests/Dockerfile, apart from the agent's container.
# It never runs code that the agent could have changed. See compose() for why.
[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 512

# Runs in the grader's container after each agent session ends: saves the server's world over RCON, which only the grader can reach,
# and writes the player's statistics and the world facts to /var/log/grading, where the artifacts entry above collects them.
[[verifier.collect]]
service = "grader"
command = "node /opt/minebot/bench/verify/snapshot.ts agent"
timeout_sec = 120.0

[environment]
build_timeout_sec = 300.0
cpus = 2
memory_mb = 2048

[environment.healthcheck]
command = "minebot observe | grep -q '\"connected\": true'"
interval_sec = 3.0
timeout_sec = 10.0
start_period_sec = 20.0
retries = 40

[[environment.mcp_servers]]
name = "minebot"
transport = "stdio"
command = "minebot"
args = ["mcp"]
