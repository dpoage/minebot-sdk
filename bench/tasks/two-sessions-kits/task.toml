schema_version = "1.4"
multi_step_reward_strategy = "final"
# Generated by bench/gen-tasks.ts. Edit the catalog there, then rerun it.
# Harbor copies from two sidecars into the trial's artifacts: the body, each program the agent ran that ended, with its output
# (/var/log/minebot; the verifier does not read it), and the grader, the player's statistics and what the saved world shows (/var/log/grading).
artifacts = [
  { source = "/var/log/minebot", destination = "minebot", service = "body" },
  { source = "/var/log/grading", destination = "grading", service = "grader" },
]

[task]
name = "minebot/two-sessions-kits"
description = "Continue a job across two sessions of the agent: stash logs in a chest and leave, then, as a new session with no memory, find the chest and craft a stone pickaxe from the logs."
keywords = ["minecraft","crafting","storage","memory","continuity","embodied","code-as-action","tier-kits"]

[metadata]
category = "minecraft"
tier = "kits"
# Every tier has the base body: Mineflayer plus notes, status (deaths and reconnects), the event log with blocking waits, the one-line observation,
# and the routine library with action and reflex bindings. The tier features are below: the built-in modules the body offers (the closure of its
# --builtins over their uses) and the wiki.
builtins = ["move","sense","dig","place","inventory","craft","items","furnace","container","gatherer","crafter","builder","explorer","social"]
wiki = "off"
goals = false
difficulty_explanation = "Two Harbor steps in one world, each a new agent session. The first sets up a chest of logs and leaves it far behind; the second has to find it again, from whatever the first session wrote down or left in the body, and use it. Tests notes and handoff, not game mechanics."

[[steps]]
name = "stash"
min_reward = 1.0

[steps.agent]
timeout_sec = 1800.0

[[steps]]
name = "retrieve"

[steps.agent]
timeout_sec = 1800.0

# The verifier runs in a container of its own, built from tests/Dockerfile, apart from the agent's container.
# It never runs code that the agent could have changed. See compose() for why.
[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 512

# Runs in the grader's container after each agent session ends: saves the server's world over RCON, which neither main nor the body can reach,
# and writes the player's statistics and the world facts to /var/log/grading, where the artifacts entry above collects them.
[[verifier.collect]]
service = "grader"
command = "node /opt/minebot/bench/verify/snapshot.ts agent"
timeout_sec = 120.0

[environment]
build_timeout_sec = 300.0
cpus = 2
memory_mb = 2048

[environment.healthcheck]
command = "minebot observe | grep -q '\"connected\": true'"
interval_sec = 3.0
timeout_sec = 10.0
start_period_sec = 20.0
retries = 40

[[environment.mcp_servers]]
name = "minebot"
transport = "stdio"
command = "minebot"
args = ["mcp"]
