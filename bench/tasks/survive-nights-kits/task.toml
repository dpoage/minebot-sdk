schema_version = "1.3"
# Generated by bench/gen-tasks.ts. Edit the catalog there, then rerun it.
# After the agent's container stops, two sidecars write what Harbor copies to the verifier: the body, every program the agent ran with its output
# (/var/log/minebot), and the grader, the player's statistics and what the saved world shows (/var/log/grading).
artifacts = [
  { source = "/var/log/minebot", destination = "minebot", service = "body" },
  { source = "/var/log/grading", destination = "grading", service = "grader" },
]

[task]
name = "minebot/survive-nights-kits"
description = "Survive 2 in-game nights in a fresh world without dying."
keywords = ["minecraft","survival","endurance","embodied","code-as-action","tier-kits"]

[metadata]
category = "minecraft"
tier = "kits"
# Every tier has the base body: Mineflayer plus notes, status (deaths and reconnects), the event log with blocking waits, and the one-line observation.
kits = ["gatherer","crafter","builder","explorer","social","survival","combat"]
wiki = "off"
goals = false
triggers = true
difficulty_explanation = "Open-ended and long: about 40 minutes of real time. Nothing is crafted or collected; the agent has to find a way to be safe through the dark, keep fed, and wait cheaply. Tests reflexes (triggers), shelter, and idling without losing the connection to the task."

[agent]
timeout_sec = 3600.0

# The verifier runs in a container of its own, built from tests/Dockerfile, after the agent's container is stopped.
# It never runs code that the agent could have changed. See compose() for why.
[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 512

# Runs in the grader's container after the agent's container is stopped: saves the server's world over RCON, which only the grader can reach,
# and writes the player's statistics and the world facts to /var/log/grading, where the artifacts entry above collects them.
[[verifier.collect]]
service = "grader"
command = "node /opt/minebot/bench/verify/snapshot.ts agent"
timeout_sec = 120.0

[environment]
build_timeout_sec = 300.0
cpus = 2
memory_mb = 2048

[environment.healthcheck]
command = "minebot observe | grep -q '\"connected\": true'"
interval_sec = 3.0
timeout_sec = 10.0
start_period_sec = 20.0
retries = 40

[[environment.mcp_servers]]
name = "minebot"
transport = "stdio"
command = "minebot"
args = ["mcp"]
