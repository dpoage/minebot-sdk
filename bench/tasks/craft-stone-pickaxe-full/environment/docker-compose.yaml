# Generated by bench/gen-tasks.ts. See compose() there for the isolation design.
services:
  main:
    depends_on:
      body:
        condition: service_healthy
    networks:
      - agent

  minecraft:
    image: minebot.local/minebot-server:26.1
    pull_policy: never
    environment:
      EULA: "true"
      RCON_PASSWORD: minebot-bench
      LEVEL_SEED: "-1395321890861809374"
      DIFFICULTY: easy
      RESTRICT_TO_OWN_SUBNET: "true"
    cap_add:
      - NET_ADMIN
    volumes:
      - world:/opt/minecraft/world
    networks:
      - game
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/25575"]
      interval: 2s
      timeout: 2s
      retries: 90
      start_period: 5s

  body:
    image: minebot.local/minebot:dev
    pull_policy: never
    command:
      - minebot
      - body
      - --bot=agent
      - --host=minecraft
      - --api-host=0.0.0.0
      - --api-port=7070
      - --history=/var/log/minebot/programs.jsonl
      # Tier "full".
      - --kits=gatherer,crafter,builder,explorer,social
      - --lock-kits
      - --no-agent-kits
      - --wiki=read
      - --no-milestones
      - --no-triggers
    environment:
      MINEBOT_TOKEN: minebot-bench-body
      RCON_PASSWORD: minebot-bench
    volumes:
      - world:/srv/minecraft-world:ro
    networks:
      - agent
      - game
    depends_on:
      minecraft:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7070/health').then(r => r.json()).then(h => process.exit(h.connected ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 5s

networks:
  agent:
  game:
    internal: true

volumes:
  world:
