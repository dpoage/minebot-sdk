# Generated by bench/gen-tasks.ts. See compose() there for the isolation design.
services:
  main:
    depends_on:
      body:
        condition: service_healthy
    networks:
      - agent

  minecraft:
    image: minebot.local/minebot-server:26.1
    pull_policy: never
    environment:
      EULA: "true"
      RCON_PASSWORD: minebot-bench
      LEVEL_SEED: "-1395321890861809374"
      DIFFICULTY: easy
      RESTRICT_TO_OWN_SUBNET: "true"
      RCON_LOOPBACK_ONLY: "true"
      WHITELIST: "[{\"uuid\":\"a1d20ed0-5e1d-362c-8cad-defa64a09a5f\",\"name\":\"agent\"}]"
    cap_add:
      - NET_ADMIN
    volumes:
      - world:/opt/minecraft/world
    networks:
      - game
    healthcheck:
      # RCON answers on loopback, and the server applied both protections: the whitelist is on and RCON is loopback-only. Fails closed.
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/127.0.0.1/25575 && grep -qx white-list=true /opt/minecraft/server.properties && nft list table inet rcon_guard | grep -q 'tcp dport 25575 drop'"]
      interval: 2s
      timeout: 2s
      retries: 90
      start_period: 5s

  body:
    image: minebot.local/minebot:dev
    pull_policy: never
    command:
      - sh
      - -c
      - "node --conditions=minebot-sdk:source /opt/minebot/bench/tier/remove.ts \"$$@\" && exec minebot \"$$@\""
      - tier
      - body
      - --bot=agent
      - --host=minecraft
      - --api-host=0.0.0.0
      - --api-port=7070
      - --history=/var/log/minebot/programs.jsonl
      # Tier "full".
      - --builtins=gatherer,crafter,builder,explorer,social
      - --wiki=read
      - --no-milestones
    environment:
      MINEBOT_TOKEN: minebot-bench-body
    networks:
      - agent
      - game
    depends_on:
      minecraft:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7070/health').then(r => r.json()).then(h => process.exit(h.connected ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 5s

  grader:
    image: minebot.local/minebot:dev
    pull_policy: never
    network_mode: "service:minecraft"
    # Idle until Harbor runs the snapshot hook in it. A process that is PID 1 ignores SIGTERM unless it handles it.
    command:
      - node
      - -e
      - "process.on('SIGTERM', () => process.exit(0)); setInterval(() => {}, 1 << 30)"
    environment:
      RCON_PASSWORD: minebot-bench
    volumes:
      - world:/srv/minecraft-world:ro
    depends_on:
      minecraft:
        condition: service_healthy

networks:
  agent:
  game:
    internal: true

volumes:
  world:
